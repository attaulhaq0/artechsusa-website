<svg xmlns="http://www.w3.org/2000/svg" width="1031" height="1142" viewBox="0 0 1031 1142" role="img" aria-labelledby="title desc">
  <title id="title">Artechs USA Careers</title>
  <desc id="desc">Two original device illustrations show career paths and résumé guidance for cloud, platform and data engineering.</desc>
  <defs>
