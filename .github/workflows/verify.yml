name: Verify website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  site-and-forms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: openssl, fileinfo, mbstring
          coverage: none
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/test_site.py
      - run: python tests/test_forms.py
  credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --pattern gitleaks_8.30.1_checksums.txt --dir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          ./gitleaks git "$GITHUB_WORKSPACE" --redact --no-banner
